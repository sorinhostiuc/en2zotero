name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate update manifest
        run: node scripts/generate-update.mjs "en2zotero-$(node -p "require('./package.json').version").xpi"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" en2zotero-*.xpi update.json --generate-notes
      - name: Update the automatic-update feed
        run: |
          cp update.json "$RUNNER_TEMP/update.json"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/update.json" update.json
          git config user.name "Sorin Hostiuc"
          git config user.email "185829520+sorinhostiuc@users.noreply.github.com"
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update feed for $GITHUB_REF_NAME"
            git push origin main
          fi
